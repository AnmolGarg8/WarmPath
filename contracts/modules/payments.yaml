paths:
  /subscriptions:
    post:
      summary: "Create checkout subscription in Razorpay test mode"
      description: "Validates student role, provisions subscription order with Razorpay test mode, and returns client checkout tokens."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: "Unique idempotency token preventing duplicate checkout orders."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        "200":
          description: "Subscription created successfully with Razorpay test mode checkout metadata."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
        "400":
          description: "Invalid plan or missing idempotency key."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: "User is restricted or not authorized to subscribe."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subscriptions/cancel:
    post:
      summary: "Cancel current active subscription"
      description: "Schedules subscription cancellation at period end or immediately in Razorpay test mode."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        "200":
          description: "Subscription cancellation processed or scheduled."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        "404":
          description: "No active subscription found to cancel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/razorpay:
    post:
      summary: "Handle Razorpay payment and refund webhooks"
      description: "Verifies HMAC-SHA256 signature against RAZORPAY_WEBHOOK_SECRET, enforces replay idempotency via payment_events, and publishes outbox events."
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 signature generated by Razorpay."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: "Webhook verified and processed (or replayed event acknowledged)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        "400":
          description: "Invalid HMAC signature or malformed payload."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payouts/request:
    post:
      summary: "Request cashout simulation for verified giver"
      description: "Initiates a payout simulation against available giver earnings (read via read-model)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRequestInput'
      responses:
        "200":
          description: "Payout request recorded successfully in test mode."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutRequestResponse'
        "400":
          description: "Insufficient earnings or invalid amount."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: "Giver is not verified."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/payouts/{id}/approve:
    post:
      summary: "Admin approves test mode payout request"
      description: "Approves and simulates payout disbursement, publishing an outbox event for ledger synchronization."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Payout request unique identifier."
      responses:
        "200":
          description: "Payout approved and simulated."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovePayoutResponse'
        "400":
          description: "Invalid payout id or status."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateSubscriptionRequest:
      type: object
      properties:
        plan_code:
          type: string
          example: "standard"
        plan_tier:
          type: string
          example: "standard"

    CreateSubscriptionResponse:
      type: object
      required:
        - subscription_id
        - order_id
        - key_id
        - amount
        - currency
        - test_mode
      properties:
        subscription_id:
          type: string
          example: "sub_test_1234567890"
        order_id:
          type: string
          example: "sub_test_1234567890"
        key_id:
          type: string
          example: "rzp_test_key"
        amount:
          type: integer
          example: 29900
        currency:
          type: string
          example: "INR"
        test_mode:
          type: boolean
          example: true

    CancelSubscriptionRequest:
      type: object
      properties:
        at_period_end:
          type: boolean
          default: true

    CancelSubscriptionResponse:
      type: object
      required:
        - success
        - message
        - test_mode
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Subscription cancellation requested"
        test_mode:
          type: boolean
          example: true

    WebhookResponse:
      type: object
      required:
        - status
        - test_mode
      properties:
        status:
          type: string
          example: "processed"
        test_mode:
          type: boolean
          example: true

    PayoutRequestInput:
      type: object
      required:
        - amount_inr
      properties:
        amount_inr:
          type: number
          format: float
          minimum: 1
          example: 500.00
        upi_id:
          type: string
          example: "alumni@okhdfcbank"

    PayoutRequestResponse:
      type: object
      required:
        - payout_id
        - status
        - amount_inr
        - message
        - test_mode
      properties:
        payout_id:
          type: string
          format: uuid
        status:
          type: string
          example: "requested"
        amount_inr:
          type: number
          format: float
          example: 500.00
        message:
          type: string
        test_mode:
          type: boolean
          example: true

    ApprovePayoutResponse:
      type: object
      required:
        - success
        - status
        - test_mode
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: "paid"
        test_mode:
          type: boolean
          example: true
