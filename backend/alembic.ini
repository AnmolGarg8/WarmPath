# Alembic configuration for WarmPath modular monolith

[alembic]
script_location = alembic
version_locations = alembic/versions app/modules/auth/migrations app/modules/trust/migrations app/modules/resume/migrations app/modules/matching/migrations app/modules/availability/migrations app/modules/sessions/migrations app/modules/ratings/migrations app/modules/credits/migrations app/modules/payments/migrations app/modules/institution/migrations

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
