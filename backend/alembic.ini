[alembic]
script_location = alembic
version_locations = %(here)s/app/core/migrations/versions %(here)s/app/modules/auth/migrations/versions %(here)s/app/modules/trust/migrations/versions %(here)s/app/modules/resume/migrations/versions %(here)s/app/modules/matching/migrations/versions %(here)s/app/modules/availability/migrations/versions %(here)s/app/modules/sessions/migrations/versions %(here)s/app/modules/ratings/migrations/versions %(here)s/app/modules/credits/migrations/versions %(here)s/app/modules/payments/migrations/versions %(here)s/app/modules/institution/migrations/versions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
