version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: warmpath-postgres
    restart: always
    environment:
      POSTGRES_USER: warmpath
      POSTGRES_PASSWORD: warmpath_password
      POSTGRES_DB: warmpath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: warmpath-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: warmpath-mailpit
    restart: always
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: warmpath-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./contracts:/workspace/contracts
    environment:
      - DATABASE_URL=postgresql+asyncpg://warmpath:warmpath_password@postgres:5432/warmpath
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - ENVIRONMENT=development
      - DEBUG=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: warmpath-worker
    restart: unless-stopped
    command: arq app.core.worker.WorkerSettings
    volumes:
      - ./backend:/workspace/backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://warmpath:warmpath_password@postgres:5432/warmpath
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
