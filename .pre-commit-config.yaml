repos:
  - repo: local
    hooks:
      - id: check-scope
        name: Enforce zero-collision folder ownership
        entry: python scripts/check_scope.py
        language: system
        pass_filenames: true
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^admin/
        additional_dependencies:
          - prettier@3.2.5

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, test, docs, refactor, chore, ci, style]
