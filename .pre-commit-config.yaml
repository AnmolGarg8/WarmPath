repos:
  - repo: local
    hooks:
      - id: check-scope
        name: WarmPath Scope Guard
        entry: python scripts/check_scope.py
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
