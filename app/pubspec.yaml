name: warmpath_app
description: "WarmPath: Intent-First Alumni Network Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  url_launcher: ^6.2.6
  webview_flutter: ^4.7.0
  razorpay_flutter: ^1.3.7
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2
  web_socket_channel: ^2.4.5
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
