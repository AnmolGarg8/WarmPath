name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scope-guard:
    name: Check File Scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check changed files scope
        run: |
          python scripts/check_scope.py --ci --pr-base origin/main

  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: warmpath
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: warmpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          if [ -f backend/pyproject.toml ]; then pip install -e backend/; fi
      - name: Ruff Lint
        run: ruff check backend/
      - name: Check Contract Paths
        run: python scripts/build_openapi.py --verify-backend
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://warmpath:secretpassword@localhost:5432/warmpath_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest -v backend/tests/ backend/app/modules/*/tests/

  app:
    name: Flutter App Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Run widget & unit tests
        run: flutter test

  admin:
    name: Admin Web Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck & Build
        run: npm run build
