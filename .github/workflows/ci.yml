name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-scope:
    name: Zero-Collision Scope Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check PR Labels for shared-change
        id: check-label
        run: |
          HAS_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'shared-change') }}"
          echo "has_label=$HAS_LABEL" >> $GITHUB_OUTPUT

      - name: Validate PR Scope
        if: steps.check-label.outputs.has_label != 'true'
        run: |
          # Detect role from branch name prefix (e.g. m1/..., m2/...) or commit messages
          BRANCH_NAME="${{ github.head_ref }}"
          ROLE=$(echo "$BRANCH_NAME" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          if [[ ! "$ROLE" =~ ^m[1-4]$ ]]; then
            echo "Branch name must start with role prefix (e.g. m1/my-feature, m2/matching). Found: $BRANCH_NAME"
            echo "Alternatively add the 'shared-change' label to the PR."
            exit 1
          fi
          
          # Get files changed in this PR compared to base
          git diff --name-only origin/${{ github.base_ref }}...HEAD > pr_files.txt
          echo "Files touched in PR:"
          cat pr_files.txt
          
          python3 scripts/check_scope.py --role "$ROLE" --files $(cat pr_files.txt)

  backend:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: warmpath
          POSTGRES_PASSWORD: warmpath_password
          POSTGRES_DB: warmpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          pip install -e backend/

      - name: Ruff Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Mypy Typecheck
        run: |
          mypy backend/app

      - name: Verify Contract Coverage
        run: |
          python3 scripts/build_openapi.py
          # Ensure openapi build succeeds and backend routes cover contract

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://warmpath:warmpath_password@localhost:5432/warmpath_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-32-chars-length!!
        run: |
          cd backend
          pytest -v

  app:
    name: Flutter App Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter App
        working-directory: app
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: app
        run: flutter test

  admin:
    name: Admin Dashboard Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: admin/package.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck & Build
        working-directory: admin
        run: npm run build
